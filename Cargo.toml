[package]
name = "tembodb"
version = "0.0.1-SNAPSHOT"
edition = "2021"
authors = ["Austin Oyugi <austinoyugi@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"

[lib]
crate-type = ["cdylib"]  # This makes sure Rust compiles it as a C-compatible dynamic library
[dependencies]
log = "0.4"
env_logger = "0.11"
lazy_static = "1.5.0"
